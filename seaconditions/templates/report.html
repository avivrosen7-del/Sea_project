<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haifa Marine Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="$theme">
  <div class="scene">
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="sea">
      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
    </div>
  </div>

  <div class="wrap">
    <h1>🌊 Haifa Marine Monitor</h1>
    <div class="sub">Updated: $updated &middot; $theme_label</div>
    <div class="stats">$stats</div>
    <div class="cards">$cards</div>
    <footer>Data: Open-Meteo</footer>
  </div>
</body>
</html>
